name: CI Pipeline

# Triggers — runs on every push and pull request to main
on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: lint + test (phases 1–4) ──────────────────────────────────────────
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Cache pip dependencies — speeds up subsequent runs
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install fastapi "uvicorn[standard]" "pydantic>=2.7" httpx

      # 5. Run ruff linter
      - name: Lint with ruff
        run: ruff check src/

      # 6. Run ruff formatter check (doesn't modify files, just checks)
      - name: Check formatting with ruff
        run: ruff format --check src/

      # 7. Run pytest
      - name: Run tests
        run: pytest
        env:
          MODEL_DIR: /tmp/artifacts
          MLFLOW_TRACKING_URI: sqlite:////tmp/mlflow_test.db

  # ── Job 2: Docker build + smoke test (phase 4) ────────────────────────────────
  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: false
          load: true
          tags: wa-solar-optimizer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — /health returns 200
        run: |
          docker run -d --name smoke \
            -p 8000:8000 \
            -e MODEL_DIR=/tmp/artifacts \
            -e MLFLOW_TRACKING_URI=sqlite:////tmp/test.db \
            wa-solar-optimizer:ci

          echo "Waiting for startup …"
          sleep 12

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
          echo "Health endpoint returned: $STATUS"
          [ "$STATUS" = "200" ] || (docker logs smoke && exit 1)

          docker stop smoke
