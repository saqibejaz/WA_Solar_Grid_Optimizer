version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# WA Solar Grid Optimizer — local development stack
#
# Services:
#   api     — FastAPI model-serving container  (always on)
#   mlflow  — MLflow tracking UI               (opt-in: --profile mlflow)
#
# Usage:
#   docker compose up --build                        # API only
#   docker compose --profile mlflow up --build       # API + MLflow UI
# ─────────────────────────────────────────────────────────────────────────────

services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: wa-solar-optimizer:dev
    container_name: wa_solar_api
    ports:
      - "8000:8000"
    environment:
      # artifacts/ matches ARTIFACTS_DIR in train_mlflow.py
      MODEL_DIR: /app/artifacts
      MLFLOW_TRACKING_URI: sqlite:////app/mlflow.db
      PORT: "8000"
      WORKERS: "1"
      LOG_LEVEL: info
    volumes:
      # Mount local artefacts produced by train_mlflow.py
      - ./artifacts:/app/artifacts:ro
      # Persist mlflow.db (already in project root)
      - ./mlflow.db:/app/mlflow.db
      # Live-reload during development — remove in production
      - ./app/main.py:/app/main.py:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: wa_solar_mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/mlflow/mlflow.db
      - ./mlruns:/mlflow/mlruns
    command: >
      mlflow server
        --backend-store-uri sqlite:////mlflow/mlflow.db
        --default-artifact-root /mlflow/mlruns
        --host 0.0.0.0
        --port 5000
    restart: unless-stopped
    profiles:
      - mlflow

volumes:
  mlruns:
